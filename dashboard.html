<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Проекты</title>
<script src="//api.bitrix24.com/api/v1/"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100%; height: 100%;
  background: #f5f6f8;
  overflow: hidden;
}

.tv {
  width: 100vw;
  height: 100vh;
  background: #f5f6f8;
  font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
  display: flex;
  flex-direction: column;
  padding: 8px 10px;
  overflow: hidden;
  color: #111827;
}

.tbl-wrap {
  flex: 1;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  border: 1px solid #e5e7eb;
  border-radius: 8px;
  background: #ffffff;
}

.tbl-hdr {
  display: grid;
  grid-template-columns: 5px 54px 1.8fr 110px 120px 70px 54px 1fr 120px;
  background: #f9fafb;
  padding: 5px 10px 5px 0;
  border-bottom: 1px solid #e5e7eb;
  flex-shrink: 0;
}
.tbl-hdr span {
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: #6b7280;
  padding: 0 6px;
}
.tbl-hdr span.r { text-align: right; }

.tbl-body {
  flex: 1;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  position: relative;
}

.row {
  display: grid;
  grid-template-columns: 5px 54px 1.8fr 110px 120px 70px 54px 1fr 120px;
  flex: 1;
  border-top: 1px solid #f0f1f4;
  align-items: center;
  min-height: 0;
  transition: background 0.2s;
}
.row.editable { cursor: pointer; }
.row.editable:hover { background: #f3f4f6; }

.row-stripe { height: 100%; }
.s-fire  { background: #ef4444; animation: sp 2s ease-in-out infinite; }
@keyframes sp { 0%,100%{background:#dc2626} 50%{background:#f87171} }
.s-prod  { background: #f59e0b; }
.s-work  { background: #8b5cf6; }
.s-agree { background: #10b981; }
.s-new   { background: #3b82f6; }
.s-done  { background: #22c55e; }

.fire-row  { background: #fef2f2; }
.prod-row  { background: #fffbeb; }
.work-row  { background: #f5f3ff; }
.agree-row { background: #ecfdf5; }
.new-row   { background: #eff6ff; }
.done-row  { background: #f0fdf4; }

.cell  { padding: 0 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nc    { overflow: hidden; padding: 0 6px; }
.r     { text-align: right; padding: 0 6px; }

.c-id      { font-size: 11px; color: #9ca3af; font-weight: 700; }
.c-name    { font-size: 13px; font-weight: 700; color: #111827; display: flex; align-items: center; gap: 6px; }
.c-pencil  { font-size: 11px; opacity: 0.6; }
.c-who     { font-size: 11px; color: #6b7280; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.c-status  { font-size: 11px; font-weight: 700; white-space: nowrap; }
.c-date    { font-size: 11px; font-weight: 600; }
.c-pct     { font-size: 13px; font-weight: 900; }
.c-comment { font-size: 10px; color: #6b7280; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.c-updated { font-size: 10px; color: #9ca3af; text-align: right; white-space: nowrap; }

.d-hot  { color: #dc2626; }
.d-warn { color: #d97706; }
.d-ok   { color: #6b7280; }
.d-done { color: #16a34a; }

.loader {
  position: absolute; inset: 0;
  background: #ffffffcc;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; color: #6b7280; font-weight: 600;
  letter-spacing: 0.5px;
  z-index: 10;
}
.spinner {
  display: inline-block; width: 16px; height: 16px;
  border: 2px solid #e5e7eb; border-top-color: #3b82f6;
  border-radius: 50%; animation: spin 0.8s linear infinite;
  margin-right: 8px; vertical-align: -3px;
}
@keyframes spin { to { transform: rotate(360deg); } }

.empty-row {
  flex: 1; display: flex; align-items: center; justify-content: center;
  font-size: 12px; color: #9ca3af; font-weight: 600;
}

/* ── ТВ-режим: крупнее ── */
.tv.tv-mode .c-id      { font-size: 16px; }
.tv.tv-mode .c-name    { font-size: 22px; }
.tv.tv-mode .c-who     { font-size: 15px; }
.tv.tv-mode .c-status  { font-size: 15px; }
.tv.tv-mode .c-date    { font-size: 17px; }
.tv.tv-mode .c-pct     { font-size: 22px; }
.tv.tv-mode .c-comment { font-size: 13px; }
.tv.tv-mode .tbl-hdr span { font-size: 13px; }
.tv.tv-mode .tbl-hdr,
.tv.tv-mode .row {
  grid-template-columns: 6px 70px 2fr 160px 180px 100px 80px 1.4fr 160px;
}

/* ── Мобильный режим ── */
@media (max-width: 768px) {
  body, html { overflow: auto; }
  .tv { padding: 6px; height: auto; min-height: 100vh; }
  .tbl-hdr { display: none; }
  .tbl-body { overflow: visible; }
  .row {
    grid-template-columns: 6px 1fr auto;
    grid-template-rows: auto auto auto;
    grid-template-areas:
      "stripe name pct"
      "stripe who  date"
      "stripe comm comm";
    padding: 8px 6px;
    gap: 2px 8px;
    flex: 0 0 auto;
    border-top: 1px solid #e5e7eb;
  }
  .row > .row-stripe { grid-area: stripe; width: 6px; }
  .row > .c-id { display: none; }
  .row > .nc { grid-area: name; }
  .row > .c-who { grid-area: who; }
  .row > .c-status { display: none; }
  .row > .c-date { grid-area: date; }
  .row > .c-pct { grid-area: pct; }
  .row > .c-comment { grid-area: comm; white-space: normal; font-size: 11px; }
  .row > .c-updated { display: none; }
  .c-name { font-size: 15px; }
  .c-pct { font-size: 16px; }
}

/* ── Модалка ── */
.modal-backdrop {
  position: fixed; inset: 0;
  background: rgba(17,24,39,0.5);
  display: none;
  align-items: center; justify-content: center;
  z-index: 100;
  padding: 16px;
}
.modal-backdrop.open { display: flex; }
.modal {
  background: #ffffff;
  border: 1px solid #e5e7eb;
  border-radius: 12px;
  padding: 20px;
  width: 100%;
  max-width: 420px;
  color: #111827;
  font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
  box-shadow: 0 10px 30px rgba(0,0,0,0.12);
}
.modal h3 {
  font-size: 14px; font-weight: 700; margin-bottom: 16px;
  color: #111827;
}
.modal label {
  display: block; font-size: 11px; color: #6b7280;
  text-transform: uppercase; letter-spacing: 0.5px;
  margin: 12px 0 4px;
}
.modal input, .modal select, .modal textarea {
  width: 100%;
  background: #ffffff;
  border: 1px solid #d1d5db;
  border-radius: 6px;
  padding: 8px 10px;
  color: #111827;
  font-size: 14px;
  font-family: inherit;
}
.modal textarea { resize: vertical; min-height: 60px; }
.modal-actions {
  display: flex; gap: 8px; justify-content: flex-end;
  margin-top: 20px;
}
.modal button {
  border: none;
  border-radius: 6px;
  padding: 9px 16px;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  font-family: inherit;
}
.btn-cancel { background: #f3f4f6; color: #374151; }
.btn-save   { background: #2563eb; color: #fff; }
.btn-save:disabled { opacity: 0.5; cursor: wait; }

.pct-row { display: flex; align-items: center; gap: 8px; }
.pct-row input[type=range] { flex: 1; }
.pct-val { font-size: 14px; font-weight: 700; color: #111827; min-width: 42px; text-align: right; }
</style>
</head>
<body>
<div class="tv" id="tv-root">
  <div class="tbl-wrap">
    <div class="tbl-hdr">
      <span></span>
      <span>№</span>
      <span>Проект</span>
      <span>Кто</span>
      <span>Статус</span>
      <span class="r">Срок</span>
      <span class="r">%</span>
      <span>Комментарий</span>
      <span class="r" id="clock-cell">—</span>
    </div>
    <div class="tbl-body" id="tbl-body">
      <div class="loader"><span class="spinner"></span>Загрузка…</div>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="modal-backdrop">
  <div class="modal" role="dialog" aria-modal="true">
    <h3 id="modal-title">Проект</h3>

    <label>Прогресс</label>
    <div class="pct-row">
      <input type="range" id="f-pct" min="0" max="100" step="5">
      <span class="pct-val" id="f-pct-val">0%</span>
    </div>

    <label>Стадия</label>
    <select id="f-stage"></select>

    <label>Срок</label>
    <input type="date" id="f-end">

    <label>Комментарий</label>
    <textarea id="f-comment" rows="3"></textarea>

    <div class="modal-actions">
      <button class="btn-cancel" id="btn-cancel">Отмена</button>
      <button class="btn-save"   id="btn-save">Сохранить</button>
    </div>
  </div>
</div>

<script>
const CONFIG = {
  ENTITY_TYPE_ID: 1068,

  FIELDS: {
    END:         'ufCrm20_1778699640',
    PROGRESS:    'ufCrm20_1778699785',
    COMMENT:     'ufCrm20_1778700051',
    TEAM:        'ufCrm20_1778700254',
    RESPONSIBLE: 'ufCrm20_1778700584',
  },

  STAGES: [
    { id: 'DT1068_26:NEW',         label: '🔥 Срочно',    stripe: 's-fire',  row: 'fire-row',  color: '#dc2626' },
    { id: 'DT1068_26:PREPARATION', label: '⚙️ Готовимся', stripe: 's-prod',  row: 'prod-row',  color: '#d97706' },
    { id: 'DT1068_26:CLIENT',      label: '⭐ Скоро',     stripe: 's-new',   row: 'new-row',   color: '#2563eb' },
    { id: 'DT1068_26:SUCCESS',     label: '✅ Успех',     stripe: 's-done',  row: 'done-row',  color: '#16a34a', terminal: true },
    { id: 'DT1068_26:FAIL',        label: '❌ Провал',     stripe: 's-done',  row: 'done-row',  color: '#6b7280', terminal: true },
  ],

  REFRESH_MS: 60 * 1000,
};

const STAGE_META = Object.fromEntries(CONFIG.STAGES.map(s => [s.id, s]));
const STAGE_ORDER = CONFIG.STAGES.map(s => s.id);
const TERMINAL_STAGES = new Set(CONFIG.STAGES.filter(s => s.terminal).map(s => s.id));
const isTerminal = (stageId) => TERMINAL_STAGES.has(stageId);

const MONTHS = ['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];

let users = {};
let currentUserId = null;
let isTV = false;
let lastItems = [];
let itemsById = {};

const WEBHOOK_URL = (() => {
  const p = new URL(location.href).searchParams.get('webhook');
  const raw = p || '';
  if (!raw) return null;
  return raw.endsWith('/') ? raw : raw + '/';
})();
const USE_WEBHOOK = !!WEBHOOK_URL;

function bx(method, params = {}) {
  return USE_WEBHOOK ? bxWebhook(method, params) : bxBX24(method, params);
}

function bxBX24(method, params) {
  return new Promise((resolve, reject) => {
    BX24.callMethod(method, params, (r) => {
      const err = r.error();
      if (err) reject(new Error(err.ex && err.ex.error_description || String(err)));
      else resolve({ data: r.data(), next: r.more() ? r.next : null, total: r.total() });
    });
  });
}

function bxWebhook(method, params) {
  const body = new URLSearchParams();
  const enc = (k, v) => {
    if (v == null) return;
    if (Array.isArray(v)) v.forEach((x, i) => enc(`${k}[${i}]`, x));
    else if (typeof v === 'object') Object.entries(v).forEach(([kk, vv]) => enc(`${k}[${kk}]`, vv));
    else body.append(k, v);
  };
  Object.entries(params).forEach(([k, v]) => enc(k, v));
  return fetch(WEBHOOK_URL + method + '.json', { method: 'POST', body })
    .then(r => r.json())
    .then(d => {
      if (d.error) throw new Error(d.error_description || d.error);
      return { data: d.result, next: d.next, total: d.total };
    });
}

async function fetchAllItems() {
  let all = [], start = 0;
  for (let i = 0; i < 30; i++) {
    const r = await bx('crm.item.list', {
      entityTypeId: CONFIG.ENTITY_TYPE_ID,
      select: ['id','title','stageId','assignedById',
               CONFIG.FIELDS.END, CONFIG.FIELDS.PROGRESS,
               CONFIG.FIELDS.COMMENT, CONFIG.FIELDS.TEAM,
               CONFIG.FIELDS.RESPONSIBLE],
      start,
    });
    const items = (r.data && r.data.items) || [];
    all = all.concat(items);
    if (items.length < 50) break;
    start += items.length;
  }
  return all;
}

async function fetchUsers(ids) {
  if (!ids.length) return;
  for (let i = 0; i < ids.length; i += 50) {
    const r = await bx('user.get', { ID: ids.slice(i, i+50) });
    (r.data || []).forEach(u => { users[String(u.ID)] = u; });
  }
}

async function fetchCurrentUser() {
  const r = await bx('user.current', {});
  currentUserId = r.data ? String(r.data.ID) : null;
}

function userName(id) {
  if (!id) return '—';
  const u = users[String(id)];
  if (!u) return '—';
  const first = (u.NAME || '').trim();
  const last  = (u.LAST_NAME || '').trim();
  return first ? first + (last ? ' ' + last[0] + '.' : '') : last || '—';
}

function teamIds(item) {
  const raw = item[CONFIG.FIELDS.TEAM];
  let ids = [];
  if (Array.isArray(raw)) ids = raw.map(String).filter(Boolean);
  else if (raw)            ids = [String(raw)];
  const resp = item[CONFIG.FIELDS.RESPONSIBLE];
  if (resp) ids.push(String(resp));
  if (item.assignedById) ids.push(String(item.assignedById));
  return [...new Set(ids)].filter(Boolean);
}

function teamLabel(item) {
  return teamIds(item).slice(0,2).map(userName).filter(n => n !== '—').join(', ') || '—';
}

function canEdit(item) {
  if (isTV) return false;
  if (USE_WEBHOOK) return true;
  if (!currentUserId) return false;
  return teamIds(item).includes(currentUserId);
}

function progress(item) {
  const v = item[CONFIG.FIELDS.PROGRESS];
  if (v !== null && v !== undefined && v !== '') return Math.max(0, Math.min(100, Math.round(Number(v))));
  return 0;
}

function commentOf(item) {
  return (item[CONFIG.FIELDS.COMMENT] || '').replace(/\[\/?[a-zA-Z0-9= "']*\]/g,'').trim();
}

function formatDate(s) {
  if (!s) return null;
  const d = new Date(s);
  if (isNaN(d)) return null;
  return d.getDate().toString().padStart(2,'0') + ' ' + MONTHS[d.getMonth()];
}

function dateClass(s, stageId) {
  if (!s || isTerminal(stageId)) return 'd-done';
  const diff = (new Date(s) - Date.now()) / 86400000;
  if (diff < 0)   return 'd-hot';
  if (diff < 1.5) return 'd-hot';
  if (diff < 5)   return 'd-warn';
  return 'd-ok';
}

function dateLabel(s, stageId) {
  if (isTerminal(stageId)) return 'готово';
  if (!s) return '—';
  const diff = (new Date(s) - Date.now()) / 86400000;
  if (diff >= 0 && diff < 0.9) return 'сегодня';
  if (diff >= 0.9 && diff < 1.9) return 'завтра';
  return formatDate(s) || '—';
}

function pctColor(pct, stageId) {
  const m = STAGE_META[stageId];
  if (!m) return '#6b7280';
  if (isTerminal(stageId)) return m.color;
  if (pct === 0) return '#d1d5db';
  return m.color;
}

function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function sortItems(items) {
  return items.slice().sort((a, b) => {
    const oa = STAGE_ORDER.indexOf(a.stageId);
    const ob = STAGE_ORDER.indexOf(b.stageId);
    if (oa !== ob) return (oa < 0 ? 99 : oa) - (ob < 0 ? 99 : ob);
    const ea = a[CONFIG.FIELDS.END] ? new Date(a[CONFIG.FIELDS.END]).getTime() : Infinity;
    const eb = b[CONFIG.FIELDS.END] ? new Date(b[CONFIG.FIELDS.END]).getTime() : Infinity;
    return ea - eb;
  });
}

function renderItems(items) {
  const body = document.getElementById('tbl-body');
  itemsById = {};
  if (!items.length) {
    body.innerHTML = '<div class="empty-row">Нет проектов</div>';
    return;
  }

  const sorted = sortItems(items);

  body.innerHTML = sorted.map(item => {
    itemsById[item.id] = item;
    const meta    = STAGE_META[item.stageId] || { label: item.stageId, stripe: 's-new', row: 'new-row', color: '#6b7280' };
    const pct     = progress(item);
    const endRaw  = item[CONFIG.FIELDS.END];
    const dLabel  = dateLabel(endRaw, item.stageId);
    const dClass  = dateClass(endRaw, item.stageId);
    const note    = esc(commentOf(item));
    const who     = esc(teamLabel(item));
    const name    = esc(item.title || 'Без названия');
    const pc      = pctColor(pct, item.stageId);
    const editable = canEdit(item);
    const pencil  = editable ? '<span class="c-pencil">✎</span>' : '';

    return `<div class="row ${meta.row} ${editable ? 'editable' : ''}" data-id="${item.id}">
      <div class="row-stripe ${meta.stripe}"></div>
      <div class="cell c-id">${item.id}</div>
      <div class="nc"><div class="c-name">${name}${pencil}</div></div>
      <div class="cell c-who">${who}</div>
      <div class="cell c-status" style="color:${meta.color}">${esc(meta.label)}</div>
      <div class="r c-date ${dClass}">${dLabel}</div>
      <div class="r c-pct" style="color:${pc}">${pct}%</div>
      <div class="cell c-comment">${note}</div>
      <div class="cell c-updated"></div>
    </div>`;
  }).join('');

  body.querySelectorAll('.row.editable').forEach(row => {
    row.addEventListener('click', () => openEditModal(row.dataset.id));
  });
}

function tick() {
  const n = new Date();
  const t = [n.getHours(), n.getMinutes(), n.getSeconds()].map(x => String(x).padStart(2,'0')).join(':');
  const el = document.getElementById('clock-cell');
  if (el) el.textContent = 'обновлено ' + t;
}

const modal = document.getElementById('modal-backdrop');
const fPct      = document.getElementById('f-pct');
const fPctVal   = document.getElementById('f-pct-val');
const fStage    = document.getElementById('f-stage');
const fEnd      = document.getElementById('f-end');
const fComment  = document.getElementById('f-comment');
const btnSave   = document.getElementById('btn-save');
const btnCancel = document.getElementById('btn-cancel');
const modalTitle= document.getElementById('modal-title');
let editingId = null;

fStage.innerHTML = CONFIG.STAGES.map(s =>
  `<option value="${s.id}">${esc(s.label)}</option>`
).join('');

fPct.addEventListener('input', () => { fPctVal.textContent = fPct.value + '%'; });
btnCancel.addEventListener('click', closeModal);
modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });

function openEditModal(id) {
  const item = itemsById[id];
  if (!item) return;
  editingId = id;
  modalTitle.textContent = item.title || 'Проект';
  fPct.value = progress(item);
  fPctVal.textContent = fPct.value + '%';
  fStage.value = item.stageId;
  const end = item[CONFIG.FIELDS.END];
  fEnd.value = end ? new Date(end).toISOString().slice(0,10) : '';
  fComment.value = commentOf(item);
  modal.classList.add('open');
}

function closeModal() {
  modal.classList.remove('open');
  editingId = null;
}

btnSave.addEventListener('click', async () => {
  if (!editingId) return;
  btnSave.disabled = true;
  btnSave.textContent = 'Сохраняю…';
  const fields = {
    stageId: fStage.value,
    [CONFIG.FIELDS.PROGRESS]: Number(fPct.value),
    [CONFIG.FIELDS.COMMENT]: fComment.value,
    [CONFIG.FIELDS.END]: fEnd.value || null,
  };
  try {
    await bx('crm.item.update', {
      entityTypeId: CONFIG.ENTITY_TYPE_ID,
      id: editingId,
      fields,
    });
    closeModal();
    await load();
  } catch (e) {
    alert('Ошибка сохранения: ' + e.message);
  } finally {
    btnSave.disabled = false;
    btnSave.textContent = 'Сохранить';
  }
});

async function load() {
  try {
    const items = await fetchAllItems();
    const userIds = [...new Set(items.flatMap(teamIds))];
    await fetchUsers(userIds);
    lastItems = items;
    renderItems(items);
  } catch (e) {
    console.error('Bitrix error:', e);
    if (!lastItems.length) {
      document.getElementById('tbl-body').innerHTML =
        '<div class="empty-row">Ошибка загрузки: ' + esc(e.message) + '</div>';
    }
  }
}

function detectMode() {
  const url = new URL(location.href);
  const m = url.searchParams.get('mode');
  if (m === 'tv') return true;
  if (m === 'mobile') return false;
  return window.innerWidth >= 1280;
}

function configReady() { return CONFIG.ENTITY_TYPE_ID > 0; }

function showSetupHint() {
  document.getElementById('tbl-body').innerHTML =
    '<div class="empty-row">Не заполнен CONFIG в dashboard.html</div>';
}

async function start() {
  if (!configReady()) { showSetupHint(); return; }
  isTV = detectMode();
  if (isTV) document.getElementById('tv-root').classList.add('tv-mode');
  if (USE_WEBHOOK) showWebhookBanner();
  try { await fetchCurrentUser(); } catch (e) { /* */ }
  tick();
  setInterval(tick, 1000);
  await load();
  setInterval(load, CONFIG.REFRESH_MS);
}

function showWebhookBanner() {
  const b = document.createElement('div');
  b.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#fef3c7;color:#92400e;font-size:11px;padding:4px 10px;text-align:center;z-index:200;font-family:-apple-system,sans-serif;border-bottom:1px solid #fcd34d;';
  b.textContent = '⚠ Демо-режим: webhook. Для прода — открой через локальное приложение в Битриксе.';
  document.body.appendChild(b);
}

function showNotInBitrix() {
  document.getElementById('tbl-body').innerHTML =
    '<div class="empty-row" style="text-align:center;line-height:1.7;padding:20px;max-width:600px;margin:auto;">' +
    'Эту страницу нужно открывать <b>внутри Битрикс24</b> как локальное приложение.<br><br>' +
    'Для быстрой проверки добавь к URL параметр:<br>' +
    '<code style="color:#d97706;font-size:11px;">?webhook=https://amiled.bitrix24.ru/rest/46/КЛЮЧ/</code>' +
    '</div>';
}

if (USE_WEBHOOK) {
  start();
} else if (typeof BX24 !== 'undefined') {
  let bxStarted = false;
  BX24.init(() => { bxStarted = true; start(); });
  setTimeout(() => { if (!bxStarted) showNotInBitrix(); }, 3000);
} else {
  showNotInBitrix();
}
</script>
